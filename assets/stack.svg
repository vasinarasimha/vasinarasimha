<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">
<defs>
  <linearGradient id="stack-bg" x1="0" y1="0" x2="840" y2="520" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#070b16"/>
    <stop offset="100%" stop-color="#0c1424"/>
  </linearGradient>
  <linearGradient id="stack-accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#247bff"/>
    <stop offset="100%" stop-color="#ff354f"/>
  </linearGradient>
  <pattern id="stack-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.6" fill="#247bff" opacity="0.06"/>
  </pattern>
</defs>
<style>
  @media (prefers-reduced-motion: reduce) {
    .stack-anim { animation: none !important; }
    .stack-orbit { animation: none !important; }
  }
  .stack-anim { animation-fill-mode: both; }
  @keyframes stack-fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes stack-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }
</style>

<!-- Background -->
<rect width="840" height="520" fill="url(#stack-bg)"/>
<rect width="840" height="520" fill="url(#stack-dots)"/>

<!-- Section title -->
<text x="40" y="48" fill="#e8eaed" font-family="'Segoe UI',system-ui,sans-serif" font-size="28" font-weight="700" class="stack-anim" style="animation: stack-fadeIn 0.7s ease-out 0s;">Tech Stack</text>
<rect x="40" y="58" width="130" height="2.5" rx="1" fill="url(#stack-accent)" opacity="0.6"/>
<text x="185" y="52" fill="#8892a4" font-family="monospace" font-size="11" opacity="0.8">BACKEND ARCHITECTURE &amp; APPLIED AI</text>

<!-- Orbital system (centered on left with ample breathing room) -->
<g transform="translate(220, 280)">
  <!-- Orbit rings (tilted ellipses) -->
  <ellipse cx="0" cy="0" rx="170" ry="62" fill="none" stroke="#1a2540" stroke-width="1" transform="rotate(-15)" opacity="0.5" class="stack-anim" style="animation: stack-pulse 4s ease-in-out infinite;"/>
  <ellipse cx="0" cy="0" rx="130" ry="48" fill="none" stroke="#1a2540" stroke-width="1" transform="rotate(15)" opacity="0.5" class="stack-anim" style="animation: stack-pulse 4s ease-in-out 1.3s infinite;"/>
  <ellipse cx="0" cy="0" rx="95" ry="35" fill="none" stroke="#1a2540" stroke-width="1" transform="rotate(-5)" opacity="0.5" class="stack-anim" style="animation: stack-pulse 4s ease-in-out 2.6s infinite;"/>

  <!-- Center icon -->
  <circle cx="0" cy="0" r="28" fill="#0d1525" stroke="#247bff" stroke-width="1.5"/>
  <text x="0" y="5" text-anchor="middle" fill="#e8eaed" font-family="monospace" font-size="10" font-weight="700">CORE</text>

  <!-- Orbit 1 items (outer) -->
  <!-- Python -->
  <g transform="rotate(-15)">
    <g>
      <circle cx="170" cy="0" r="17" fill="#0d1525" stroke="#3776AB" stroke-width="1.5"/>
      <text x="170" y="4" text-anchor="middle" fill="#3776AB" font-family="monospace" font-size="8" font-weight="700">PY</text>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>
  <!-- FastAPI -->
  <g transform="rotate(-15)">
    <g>
      <circle cx="-170" cy="0" r="17" fill="#0d1525" stroke="#009688" stroke-width="1.5"/>
      <text x="-170" y="4" text-anchor="middle" fill="#009688" font-family="monospace" font-size="7" font-weight="700">FAPI</text>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>
  <!-- PostgreSQL -->
  <g transform="rotate(-15)">
    <g>
      <circle cx="0" cy="62" r="17" fill="#0d1525" stroke="#336791" stroke-width="1.5"/>
      <text x="0" y="66" text-anchor="middle" fill="#336791" font-family="monospace" font-size="7" font-weight="700">PG</text>
      <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="20s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>
  <!-- Django -->
  <g transform="rotate(-15)">
    <g>
      <circle cx="0" cy="-62" r="17" fill="#0d1525" stroke="#092E20" stroke-width="1.5"/>
      <text x="0" y="-58" text-anchor="middle" fill="#44B78B" font-family="monospace" font-size="7" font-weight="700">DJ</text>
      <animateTransform attributeName="transform" type="rotate" from="240" to="600" dur="20s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>

  <!-- Orbit 2 items (middle) -->
  <!-- React -->
  <g transform="rotate(15)">
    <g>
      <circle cx="130" cy="0" r="15" fill="#0d1525" stroke="#61DAFB" stroke-width="1.5"/>
      <text x="130" y="4" text-anchor="middle" fill="#61DAFB" font-family="monospace" font-size="7" font-weight="700">RE</text>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="16s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>
  <!-- Docker -->
  <g transform="rotate(15)">
    <g>
      <circle cx="-130" cy="0" r="15" fill="#0d1525" stroke="#2496ED" stroke-width="1.5"/>
      <text x="-130" y="4" text-anchor="middle" fill="#2496ED" font-family="monospace" font-size="7" font-weight="700">DK</text>
      <animateTransform attributeName="transform" type="rotate" from="120" to="-240" dur="16s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>
  <!-- Redis -->
  <g transform="rotate(15)">
    <g>
      <circle cx="0" cy="48" r="15" fill="#0d1525" stroke="#DC382D" stroke-width="1.5"/>
      <text x="0" y="52" text-anchor="middle" fill="#DC382D" font-family="monospace" font-size="7" font-weight="700">RD</text>
      <animateTransform attributeName="transform" type="rotate" from="240" to="-120" dur="16s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>

  <!-- Orbit 3 items (inner) -->
  <!-- SQL -->
  <g transform="rotate(-5)">
    <g>
      <circle cx="95" cy="0" r="13" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
      <text x="95" y="3" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="7" font-weight="700">SQL</text>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>
  <!-- Git -->
  <g transform="rotate(-5)">
    <g>
      <circle cx="-95" cy="0" r="13" fill="#0d1525" stroke="#F05032" stroke-width="1"/>
      <text x="-95" y="3" text-anchor="middle" fill="#F05032" font-family="monospace" font-size="7" font-weight="700">GIT</text>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="12s" repeatCount="indefinite" class="stack-orbit"/>
    </g>
  </g>
</g>

<!-- Right side: Grouped stack chips with spacious margins -->
<g class="stack-anim" style="animation: stack-fadeIn 0.6s ease-out 0.3s;">
  <!-- Languages -->
  <text x="465" y="92" fill="#247bff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">LANGUAGES</text>
  <g transform="translate(465, 104)">
    <rect x="0" y="0" width="72" height="26" rx="6" fill="#0d1525" stroke="#3776AB" stroke-width="1"/>
    <text x="36" y="17" text-anchor="middle" fill="#3776AB" font-family="monospace" font-size="10">Python</text>
    <rect x="80" y="0" width="52" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="106" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">SQL</text>
    <rect x="140" y="0" width="90" height="26" rx="6" fill="#0d1525" stroke="#F7DF1E" stroke-width="1"/>
    <text x="185" y="17" text-anchor="middle" fill="#F7DF1E" font-family="monospace" font-size="10">JavaScript</text>
    <rect x="238" y="0" width="90" height="26" rx="6" fill="#0d1525" stroke="#3178C6" stroke-width="1"/>
    <text x="283" y="17" text-anchor="middle" fill="#3178C6" font-family="monospace" font-size="10">TypeScript</text>
  </g>

  <!-- Backend -->
  <text x="465" y="158" fill="#247bff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">BACKEND</text>
  <g transform="translate(465, 170)">
    <rect x="0" y="0" width="72" height="26" rx="6" fill="#0d1525" stroke="#009688" stroke-width="1"/>
    <text x="36" y="17" text-anchor="middle" fill="#009688" font-family="monospace" font-size="10">FastAPI</text>
    <rect x="80" y="0" width="72" height="26" rx="6" fill="#0d1525" stroke="#44B78B" stroke-width="1"/>
    <text x="116" y="17" text-anchor="middle" fill="#44B78B" font-family="monospace" font-size="10">Django</text>
    <rect x="160" y="0" width="54" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="187" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">Flask</text>
    <rect x="222" y="0" width="86" height="26" rx="6" fill="#0d1525" stroke="#247bff" stroke-width="1"/>
    <text x="265" y="17" text-anchor="middle" fill="#247bff" font-family="monospace" font-size="10">REST APIs</text>
  </g>

  <!-- Databases & Storage -->
  <text x="465" y="224" fill="#247bff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">DATA &amp; STORAGE</text>
  <g transform="translate(465, 236)">
    <rect x="0" y="0" width="92" height="26" rx="6" fill="#0d1525" stroke="#336791" stroke-width="1"/>
    <text x="46" y="17" text-anchor="middle" fill="#336791" font-family="monospace" font-size="10">PostgreSQL</text>
    <rect x="98" y="0" width="64" height="26" rx="6" fill="#0d1525" stroke="#4479A1" stroke-width="1"/>
    <text x="130" y="17" text-anchor="middle" fill="#4479A1" font-family="monospace" font-size="10">MySQL</text>
    <rect x="168" y="0" width="90" height="26" rx="6" fill="#0d1525" stroke="#D71E00" stroke-width="1"/>
    <text x="213" y="17" text-anchor="middle" fill="#D71E00" font-family="monospace" font-size="10">SQLAlchemy</text>
    <rect x="264" y="0" width="72" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="300" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">pgvector</text>
  </g>

  <!-- AI Engineering -->
  <text x="465" y="290" fill="#ff354f" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">AI ENGINEERING</text>
  <g transform="translate(465, 302)">
    <rect x="0" y="0" width="50" height="26" rx="6" fill="#0d1525" stroke="#ff354f" stroke-width="1"/>
    <text x="25" y="17" text-anchor="middle" fill="#ff354f" font-family="monospace" font-size="10">RAG</text>
    <rect x="58" y="0" width="118" height="26" rx="6" fill="#0d1525" stroke="#ff354f" stroke-width="1"/>
    <text x="117" y="17" text-anchor="middle" fill="#ff354f" font-family="monospace" font-size="10">Semantic Search</text>
    <rect x="184" y="0" width="110" height="26" rx="6" fill="#0d1525" stroke="#ff354f" stroke-width="1"/>
    <text x="239" y="17" text-anchor="middle" fill="#ff354f" font-family="monospace" font-size="10">Transformers</text>
  </g>

  <!-- Infrastructure -->
  <text x="465" y="356" fill="#247bff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">INFRASTRUCTURE</text>
  <g transform="translate(465, 368)">
    <rect x="0" y="0" width="70" height="26" rx="6" fill="#0d1525" stroke="#2496ED" stroke-width="1"/>
    <text x="35" y="17" text-anchor="middle" fill="#2496ED" font-family="monospace" font-size="10">Docker</text>
    <rect x="78" y="0" width="60" height="26" rx="6" fill="#0d1525" stroke="#DC382D" stroke-width="1"/>
    <text x="108" y="17" text-anchor="middle" fill="#DC382D" font-family="monospace" font-size="10">Redis</text>
    <rect x="146" y="0" width="68" height="26" rx="6" fill="#0d1525" stroke="#89B63F" stroke-width="1"/>
    <text x="180" y="17" text-anchor="middle" fill="#89B63F" font-family="monospace" font-size="10">Celery</text>
    <rect x="222" y="0" width="94" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="269" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">Git / CI/CD</text>
  </g>

  <!-- Security & System -->
  <text x="465" y="422" fill="#247bff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2">SECURITY &amp; SYSTEM</text>
  <g transform="translate(465, 434)">
    <rect x="0" y="0" width="52" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="26" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">JWT</text>
    <rect x="60" y="0" width="60" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="90" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">RBAC</text>
    <rect x="128" y="0" width="78" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="167" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">AES-256</text>
    <rect x="214" y="0" width="92" height="26" rx="6" fill="#0d1525" stroke="#8892a4" stroke-width="1"/>
    <text x="260" y="17" text-anchor="middle" fill="#8892a4" font-family="monospace" font-size="10">WebSockets</text>
  </g>
</g>

<!-- Bottom accent border -->
<rect x="0" y="517" width="840" height="3" fill="url(#stack-accent)" opacity="0.3"/>
</svg>